name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip ZombieApocalypse-github.zip
      - run: cd ZombieApocalypse && mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ZombieApocalypse-jar
          path: ZombieApocalypse/target/ZombieApocalypse.jar
